  - name: Add SukiSU
    shell: bash
    if: ${{ inputs.ksu_type == 'SUKISU' }}
    run: "set -euo pipefail\necho \"::group::Add SukiSU\"\n\ncd \"$KERNEL_PLATFORM_FOLDER\"\n\nSUKISU_SETUP_SCRIPT=\"$(mktemp /tmp/rsksu_setup_XXXXXX.sh)\"\ntrap 'rm -f \"$SUKISU_SETUP_SCRIPT\"' EXIT\n\necho \"Downloading SukiSU setup script...\"\nif ! curl --fail --location --proto '=https' --tlsv1.2 -LSs \\\n  --retry 5 --retry-delay 5 --retry-all-errors \\\n  \"https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh\" \\\n  -o \"$SUKISU_SETUP_SCRIPT\"; then\n  echo \"::error::Failed to download SukiSU setup.sh after retries\"\n  exit 1\nfi\n\nSCRIPT_SIZE=\"$(stat -c%s \"$SUKISU_SETUP_SCRIPT\")\"\nif [ \"$SCRIPT_SIZE\" -lt 512 ]; then\n  echo \"::error::Downloaded setup.sh is suspiciously small (${SCRIPT_SIZE} bytes). Aborting.\"\n  exit 1\nfi\n\nif ! head -n1 \"$SUKISU_SETUP_SCRIPT\" | grep -q '^#!'; then\n  echo \"::error::Downloaded setup.sh does not start with a shebang. Aborting.\"\n  exit 1\nfi\n\nchmod +x \"$SUKISU_SETUP_SCRIPT\"\n\nKSU_INPUT=\"${{ inputs.ksu_branch_or_hash\
      \ }}\"\nif [ -z \"$KSU_INPUT\" ]; then\n  echo \"No branch/hash provided \u2014 using default installer mode.\"\n  bash \"$SUKISU_SETUP_SCRIPT\"\nelse\n  echo \"Using SukiSU branch/hash: $KSU_INPUT\"\n  bash \"$SUKISU_SETUP_SCRIPT\" \"$KSU_INPUT\"\nfi\n\nif [ ! -d \"$KERNEL_PLATFORM_FOLDER/KernelSU\" ]; then\n  echo \"::error::KernelSU directory was not created by SukiSU setup.\"\n  find \"$KERNEL_PLATFORM_FOLDER\" -maxdepth 3 -type d \\( -iname \"*ksu*\" -o -iname \"*suki*\" \\) || true\n  exit 1\nfi\n\ncd \"$KERNEL_PLATFORM_FOLDER/KernelSU\"\n\nKSU_COMMIT_SHA=\"$(git rev-parse HEAD 2>/dev/null || echo unknown)\"\nCOMMITS_COUNT=\"$(git rev-list --count HEAD 2>/dev/null || true)\"\nif [[ ! \"$COMMITS_COUNT\" =~ ^[0-9]+$ ]]; then\n  echo \"::warning::Could not determine commit count, using fallback 30000.\"\n  COMMITS_COUNT=30000\nfi\n\nBASE_VERSION=37185\nKSU_VERSION=$((COMMITS_COUNT + BASE_VERSION))\n\necho \"SukiSU commits: $COMMITS_COUNT\"\necho \"SukiSU version: $KSU_VERSION\"\n\
      echo \"SukiSU commit:  $KSU_COMMIT_SHA\"\n\n# SukiSU Ultra reports its version via DKSU_VERSION in kernel/Makefile.\nif [ -f \"$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Makefile\" ]; then\n  sed -i \"s/DKSU_VERSION=[0-9]*/DKSU_VERSION=${KSU_VERSION}/\" \"$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Makefile\" || true\nfi\n\n# Brand the manager's \"Kernel full version\" string. SukiSU-Ultra does NOT read\n# CONFIG_KSU_FULL_NAME_FORMAT (it's referenced nowhere in the source); the shown\n# string is KSU_VERSION_FULL, built in kernel/Kbuild as v<tag>-<sha>@<branch>\n# (@HEAD when pinned to a tag / detached checkout). Override it to a fixed brand.\nif [ -f \"$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Kbuild\" ]; then\n  sed -i 's#^KSU_VERSION_FULL :=.*#KSU_VERSION_FULL := v$(VERSION_TAG)-\u26A1Ultra\u26A1@SukiSU#' \"$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Kbuild\" || true\nfi\n\n{\n  echo \"KSU_COMMIT_SHA=$KSU_COMMIT_SHA\"\n  echo \"KSUVER=$KSU_VERSION\"\n} >> \"$GITHUB_ENV\"\n\ncd ..\n\nDEFCONFIG=\"\
      $COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig\"\nmkdir -p \"$(dirname \"$DEFCONFIG\")\"\ntouch \"$DEFCONFIG\"\n\nTAG_NAME=\"$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null || echo v1.0.0)\"\n\nsed -i \\\n  -e '/^CONFIG_KSU=/d' \\\n  -e '/^CONFIG_KPM=/d' \\\n  -e '/^CONFIG_KSU_MULTI_MANAGER_SUPPORT=/d' \\\n  -e '/^CONFIG_KSU_FULL_NAME_FORMAT=/d' \\\n  \"$DEFCONFIG\" || true\n\n{\n  printf '%s\\n' 'CONFIG_KSU=y'\n  if [ \"$OP_KPM\" = \"true\" ]; then\n    printf '%s\\n' 'CONFIG_KPM=y'\n    echo \"KPM: enabled\"\n  else\n    printf '%s\\n' 'CONFIG_KPM=n'\n    echo \"KPM: disabled\"\n  fi\n  printf '%s\\n' 'CONFIG_KSU_MULTI_MANAGER_SUPPORT=y'\n  # (CONFIG_KSU_FULL_NAME_FORMAT dropped \u2014 SukiSU-Ultra ignores it; the version\n  #  string is branded via KSU_VERSION_FULL in the Kbuild above.)\n} >> \"$DEFCONFIG\"\n\n{\n  echo \"SUKISU\"\n  echo \"$KSU_VERSION\"\n} >> \"${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt\"\n\necho \"\u2705 SukiSU added (commit: ${KSU_COMMIT_SHA:0:8})\"\
      \necho \"::endgroup::\"\n"
  - name: Apply SUSFS Patches (SukiSU)
    shell: bash
    if: ${{ env.OP_SUSFS == 'true' }}
    env:
      ANDROID_VER_LOCAL: ${{ env.ANDROID_VER }}
