    run: 'set -euo pipefail

      echo "::group::Apply SukiSU SELinux-hide implementation"

      SCRIPT="$GITHUB_WORKSPACE/configs/apply_sukisu_selinux_hide_fix.sh"

      TARGET="$COMMON_KERNEL_FOLDER"

