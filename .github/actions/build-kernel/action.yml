      '
  - name: Disable Vendor / Kernel Modules
    shell: bash
    run: "set -euo pipefail\necho \"Disabling Vendor / Kernel Modules\"\ncd \"$COMMON_KERNEL_FOLDER\"\n\n# Define modules that MUST NEVER be blacklisted\nRISKY_MODULES=(\"coresight\" \"rust_binder\" \"msm_kgsl\" \"camera\")\n\ndeclare -a modules=()\nIFS=',' read -ra ADDR <<< \"$OP_BLACKLIST_MODULES\"\nfor mod in \"${ADDR[@]}\"; do\n  [[ -n \"$mod\" ]] && modules+=(\"$mod\")\ndone\n\n# Safety Validation Loop (Filter out risky modules)\ndeclare -a validated_modules=()\nfor mod in \"${modules[@]}\"; do\n  is_risky=false\n  \n  # Check if current module matches any risky module\n  for risky in \"${RISKY_MODULES[@]}\"; do\n    if [ \"$mod\" = \"$risky\" ]; then\n      is_risky=true\n      echo \"\u26A0\uFE0F WARNING: Blocked attempt to blacklist protected module: $mod\"\n      break\n    fi\n  done\n  \n  # Only keep the module if it's safe\n  if [ \"$is_risky\" = false ]; then\n    validated_modules+=(\"$mod\")\n  fi\ndone\n\nif [ ${#validated_modules[@]} -gt 0 ]; then\n  RAW_JOINED=$(IFS=,;\
      \ echo \"${validated_modules[*]}\")\n  RESULT_LIST=\"\\\"${RAW_JOINED}\\\"\"\nelse\n  RESULT_LIST='\"\"'\nfi\n\necho \"Disabling following kernel modules: ${RESULT_LIST}\"\n\necho \"CONFIG_DEBLOAT_VENDOR_MODULES=${RESULT_LIST}\" >> \"$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig\"\n\nKERNEL_VERSION=\"${{ env.KERNEL_VER }}\"\nMIN_VERSION=\"5.16\"\nif [ \"$(printf '%s\\n' \"$KERNEL_VERSION\" \"$MIN_VERSION\" | sort -V | head -n1)\" = \"$KERNEL_VERSION\" ]; then\n  curl -Ls https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/experimental/0001-Support-conditional-vendor-modules-blacklisting-5.15-and-below.patch | patch -p1\nelse\n  curl -Ls https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/experimental/0001-Support-conditional-vendor-modules-blacklisting-6.1-and-above.patch | patch -p1\nfi        \n"
  - name: "\U0001F527 Add ADIOS I/O Scheduler"
    shell: bash
    if: ${{ inputs.enable_adios == true || inputs.enable_adios == 'true' }}
    run: "set -euo pipefail\necho \"::group::Add ADIOS I/O Scheduler\"\n\ncd \"$COMMON_KERNEL_FOLDER\"\n\nif [ -z \"${ADIOS_PATCHES_FOLDER:-}\" ]; then\n  echo \"::error::ADIOS_PATCHES_FOLDER is not set\"\n  exit 1\nfi\n\nif [ ! -d \"$ADIOS_PATCHES_FOLDER\" ]; then\n  echo \"::error::ADIOS patches folder not found: $ADIOS_PATCHES_FOLDER\"\n  exit 1\nfi\n\nPATCH_FILE=\"\"\n\ncase \"${KERNEL_VER}\" in\n  \"6.12\")\n    PATCH_FILE=\"$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.12.patch\"\n    ;;\n  \"6.6\")\n    PATCH_FILE=\"$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.6.patch\"\n    ;;\n  \"5.15\")\n    PATCH_FILE=\"$ADIOS_PATCHES_FOLDER/adios_ioscheduler_5.15.patch\"\n    ;;\n  \"5.10\")\n    PATCH_FILE=\"$ADIOS_PATCHES_FOLDER/adios_ioscheduler_5.10.patch\"\n    ;;\n  \"6.1\")\n    if [ \"${TKERNEL_VER:-}\" = \"6.1.115\" ] \\\n      && { [[ \"${OP_BRANCH:-}\" == *mt* ]] || [[ \"${OP_SOC:-}\" == *dimensity* ]] \\\n        || [[ \"${OP_SOC:-}\" == *mediatek* ]] || [[ \"${OP_SOC:-}\" == *mt* ]]; };\
      \ then\n      PATCH_FILE=\"$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1_mt6989.patch\"\n    elif [ \"${TKERNEL_VER:-}\" = \"6.1.57\" ] || [ \"${TKERNEL_VER:-}\" = \"6.1.75\" ]; then\n      PATCH_FILE=\"$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1_old.patch\"\n    else\n      PATCH_FILE=\"$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1.patch\"\n    fi\n    ;;\n  *)\n    echo \"::warning::ADIOS not configured for kernel ${KERNEL_VER} (supported: 5.10, 5.15, 6.1, 6.6, 6.12)\"\n    echo \"::endgroup::\"\n    exit 0\n    ;;\nesac\n\nif [ ! -f \"$PATCH_FILE\" ]; then\n  echo \"::error::ADIOS patch not found: $PATCH_FILE\"\n  find \"$ADIOS_PATCHES_FOLDER\" -maxdepth 3 -type f -iname \"*adios*\" -print || true\n  exit 1\nfi\n\nif [ -f \"block/adios.c\" ]; then\n  echo \"ADIOS source already exists. Skipping.\"\nelse\n  cp \"$PATCH_FILE\" ./adios.patch\n\n  if patch -p1 --ignore-whitespace -F 3 < adios.patch 2>&1 | tee /tmp/adios_patch.log; then\n    echo \"ADIOS patch applied successfully\"\n  else\n\
      \    echo \"::warning::ADIOS patch reported an issue\"\n    if grep -q \"malformed patch\" /tmp/adios_patch.log; then\n      patch -p1 --force --ignore-whitespace < adios.patch || true\n    fi\n    if find . -name \"*.rej\" -print -quit | grep -q .; then\n      echo \"::error::ADIOS patch failed. Reject files:\"\n      find . -name \"*.rej\" -exec echo \"=== {} ===\" \\; -exec cat {} \\;\n      exit 1\n    fi\n  fi\n\n  rm -f adios.patch\nfi\n\nDEFCONFIG=\"$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig\"\n\nif ! grep -q \"^CONFIG_MQ_IOSCHED_ADIOS=\" \"$DEFCONFIG\"; then\n  {\n    echo \"CONFIG_MQ_IOSCHED_ADIOS=y\"\n    echo \"CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y\"\n  } >> \"$DEFCONFIG\"\nfi\n\necho \"\u2705 ADIOS I/O scheduler setup completed\"\necho \"::endgroup::\"\n"
  - name: Build Kernel
    id: build_kernel_step
    shell: bash
    env:
      PYTHONWARNINGS: ignore:invalid escape sequence
      CCACHE_EXTRAFILES: $COMMON_KERNEL_FOLDER/out/kernel/config_data.gz
    run: "set -euo pipefail\necho \"::group::Build kernel with ccache optimization\"\n\ncd \"$COMMON_KERNEL_FOLDER\"\n: > \"$COMMON_KERNEL_FOLDER/.scmversion\"\n\nexport PYTHONWARNINGS=\"${PYTHONWARNINGS}\"\n\necho \"Getting last commit timestamp from kernel source...\"\nCOMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo \"$(date +%s)\")\nCOMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u '+%Y-%m-%d %H:%M:%S')\nCOMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo \"unknown\")\n\nWORKSPACE=\"${GITHUB_WORKSPACE}\"\nMAP=\"-fdebug-prefix-map=${WORKSPACE}=.\"\nMPMAP=\"-fmacro-prefix-map=${WORKSPACE}=.\"\nFPMAP=\"-ffile-prefix-map=${WORKSPACE}=.\"\n\nexport KCFLAGS=\"${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__\"\nexport KCPPFLAGS=\"${KCPPFLAGS:-} $MAP $MPMAP $FPMAP\"\n\nexport LLVM=1 LLVM_IAS=1\nexport ARCH=arm64 SUBARCH=arm64\n\
      export CROSS_COMPILE=aarch64-linux-gnu-\nexport PAHOLE=\"$KERNEL_PLATFORM_FOLDER/prebuilts/kernel-build-tools/linux-x86/bin/pahole\"\nexport LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm \nexport OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip\n\nset +u\nsource \"$KERNEL_PLATFORM_FOLDER/build/kernel/_setup_env.sh\" 2>/dev/null || true\nset -u\n\necho '#!/bin/bash' > \"$COMMON_KERNEL_FOLDER/ld-wrapper\"\necho 'ld.lld \"$@\" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(nproc --all)' >> \"$COMMON_KERNEL_FOLDER/ld-wrapper\"\nchmod +x \"$COMMON_KERNEL_FOLDER/ld-wrapper\"\n\nKERNEL_BUILD_DATE=$(date -u)\nexport SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP\nif [ -n \"${{ inputs.build_timestamp }}\" ]; then\n  export KBUILD_BUILD_TIMESTAMP=\"${{ inputs.build_timestamp }}\"\n  echo \"\U0001F4C5 Using custom build timestamp: $KBUILD_BUILD_TIMESTAMP\"\nelse\n  export KBUILD_BUILD_TIMESTAMP=\"$KERNEL_BUILD_DATE\"\n  echo \"\U0001F4C5 Using current UTC build timestamp: $KBUILD_BUILD_TIMESTAMP\"\
      \nfi\necho \"EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP\" >> \"$GITHUB_ENV\"\nexport KBUILD_BUILD_USER=\"${BUILD_USER:-kernel}\"\nexport KBUILD_BUILD_HOST=\"${BUILD_HOST:-kleaf}\"\nexport KBUILD_BUILD_VERSION=1\necho \"\U0001F522 SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH\"\necho \"\U0001F464 Build user: $KBUILD_BUILD_USER\"\necho \"\U0001F5A5\uFE0F  Build host: $KBUILD_BUILD_HOST\"\n\nexport CC=\"ccache clang\"\nexport CXX=\"ccache clang++\"\nexport HOSTCC=\"ccache clang\"\nexport HOSTCXX=\"ccache clang++\"\n\nif [ \"${{ inputs.clean }}\" = \"false\" ]; then\n  echo \"\U0001F680 ccache-accelerated build\"\nelse\n  echo \"\U0001F9F9 Clean build mode\"\nfi\n\nOUT=out\nmkdir -p \"$OUT\"\n\necho \"============================================\"\necho \"\U0001F50D Compiler & ccache Verification\"\necho \"============================================\"\necho \"PATH: ${PATH:0:200}...\"\necho \"which clang: $(which clang)\"\necho \"CC: $CC\"\necho \"CXX: $CXX\"\necho \"CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not\
      \ set}\"\necho \"\"\n\necho \"ccache wrapper test:\"\nclang --version 2>&1 | head -n1 || true\necho \"\"\necho \"ccache configuration:\"\nccache -p | grep -E \"(compression|direct_mode|readonly_direct|depend|sloppiness)\" || true\necho \"\"\necho \"ccache pre-build status:\"\nccache -s | head -n 20\necho \"============================================\"\n\nmake LD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" HOSTLD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" O=\"$OUT\" gki_defconfig\n\nLOCAL_LOCALVERSION=\"${CUSTOM_LOCALVERSION:--OP-WILD}\"\nif [ -n \"${LOCAL_LOCALVERSION:-}\" ]; then\n  scripts/config --file \"$OUT/.config\" --set-str LOCALVERSION \"${LOCAL_LOCALVERSION}\"\n  scripts/config --file \"$OUT/.config\" -d LOCALVERSION_AUTO || true\n  sed -i 's/scm_version=\"$(scm_version --short)\"/scm_version=\"\"/' scripts/setlocalversion\nfi\n\nif [ \"${{ inputs.optimize_level }}\" = \"O3\" ]; then\n  scripts/config --file \"$OUT/.config\" -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3\n\
      \  KCFLAGS_EXTRA=\"-O3\"\nelse\n  scripts/config --file \"$OUT/.config\" -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3\n  KCFLAGS_EXTRA=\"-O2\"\nfi\n\ncase \"$OP_BRANCH\" in\n  wild/sm8750|wild/sm8850|wild/sm8845)\n    KCFLAGS_EXTRA=\"-mcpu=oryon-1 ${KCFLAGS_EXTRA}\"\n    ;;\nesac\n\nscripts/config --file \"$OUT/.config\" -e LTO_CLANG -d LTO_CLANG_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL\n\ncase \"${{ env.OP_LTO}}\" in\n  \"none\") scripts/config --file \"$OUT/.config\" -e LTO_CLANG_NONE ;;\n  \"thin\") scripts/config --file \"$OUT/.config\" -e LTO_CLANG_THIN ;;\n  \"full\") scripts/config --file \"$OUT/.config\" -e LTO_CLANG_FULL ;;\n  *)\n    echo \"::error::Unsupported LTO option: ${{ env.OP_LTO}}\"\n    exit 1\n    ;;\nesac\n\n\n# Strip KUnit test symbols that vendor defconfig may pull in\ndisable_list=(\n  CONFIG_REGMAP_KUNIT\n  CONFIG_INPUT_KUNIT_TEST\n  CONFIG_SND_SOC_TOPOLOGY_KUNIT_TEST\n  CONFIG_SND_SOC_UTILS_KUNIT_TEST\n  CONFIG_HID_KUNIT_TEST\n  CONFIG_RTC_LIB_KUNIT_TEST\n\
      \  CONFIG_CLK_KUNIT_TEST\n  CONFIG_CLK_GATE_KUNIT_TEST\n  CONFIG_IIO_FORMAT_KUNIT_TEST\n  CONFIG_EXT4_KUNIT_TESTS\n  CONFIG_FAT_KUNIT_TEST\n)\n\nfor sym in \"${disable_list[@]}\"; do\n  scripts/config --file \"$OUT/.config\" -d \"$sym\" 2>/dev/null || true\ndone\n\nmake LD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" HOSTLD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" O=\"$OUT\" olddefconfig\n\nKCFLAGS=\"$KCFLAGS -Wno-error -pipe ${KCFLAGS_EXTRA}\"\nKCPPFLAGS=\"$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING\"\n\necho \"============================================\"\necho \"\U0001F527 Build Configuration\"\necho \"============================================\"\necho \"Device: ${OP_MODEL}\"\necho \"Kernel: ${KERNEL_FULL_VER}\"\necho \"Threads: $(nproc --all)\"\necho \"Optimization: ${{ inputs.optimize_level }}\"\necho \"KCFLAGS: ${KCFLAGS:0:150}...\"\necho \"KCPPFLAGS: ${KCPPFLAGS:0:150}...\"\necho \"Timestamp: $KBUILD_BUILD_TIMESTAMP\"\necho \"Workspace: $WORKSPACE\"\n\necho \"ccache: ENABLED\"\necho \"  Dir:\
      \ $CCACHE_DIR\"\necho \"  Base: $CCACHE_BASEDIR\"\necho \"  Max size: $CCACHE_MAXSIZE\"\necho \"  Compression: zstd level 3\"\necho \"  Features: readonly_direct, file_clone, inode_cache, depend\"\necho \"============================================\"\n\nif [ ! -d \"$CCACHE_DIR\" ] || [ -z \"$(find \"$CCACHE_DIR\" -type f 2>/dev/null | head -n1)\" ]; then\n  echo \"\U0001F525 Priming cache with header preprocessing...\"\n  make LD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" HOSTLD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" -C \"$COMMON_KERNEL_FOLDER\" O=\"$OUT\" headers_install prepare 2>&1 | head -n 20 || true\n  echo \"\"\nfi\n\nBUILD_START=$(date +%s)\nset -o pipefail\n\nif [ \"${{ inputs.debug }}\" == \"true\" ]; then\n  make LD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" HOSTLD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" -j\"$(nproc --all)\" O=\"$OUT\" KCFLAGS=\"$KCFLAGS\" KCPPFLAGS=\"$KCPPFLAGS\" Image modules 2>&1 | tee build.log\n  make LD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" HOSTLD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\"\
      \ -j\"$(nproc --all)\" O=\"$COMMON_KERNEL_FOLDER/out\" KCFLAGS=\"$KCFLAGS\" KCPPFLAGS=\"$KCPPFLAGS\" INSTALL_MOD_PATH=\"$COMMON_KERNEL_FOLDER/out/install\" modules_install 2>&1 | tee install.log\n  \n  cp build.log \"$DEBUG_ARTIFACTS_FOLDER/build.log\"\n  cp install.log \"$DEBUG_ARTIFACTS_FOLDER/install.log\"\n  rsync -av --no-links --exclude='build' \"$COMMON_KERNEL_FOLDER/out/install/lib/modules\"/*/ \"$DEBUG_ARTIFACTS_FOLDER\"\n  cp \"$COMMON_KERNEL_FOLDER/out/vmlinux\" \"$DEBUG_ARTIFACTS_FOLDER/vmlinux\"\n  cp \"$COMMON_KERNEL_FOLDER/out/Module.symvers\" \"$DEBUG_ARTIFACTS_FOLDER/Module.symvers\"\n  cp \"$COMMON_KERNEL_FOLDER/out/System.map\" \"$DEBUG_ARTIFACTS_FOLDER/System.map\"\n  \n  ls -la \"$DEBUG_ARTIFACTS_FOLDER\"\nelse\n  make LD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" HOSTLD=\"$COMMON_KERNEL_FOLDER/ld-wrapper\" -j\"$(nproc --all)\" O=\"$OUT\" KCFLAGS=\"$KCFLAGS\" KCPPFLAGS=\"$KCPPFLAGS\" Image 2>&1 | tee build.log\nfi\n\nBUILD_END=$(date +%s)\nBUILD_TIME=$((BUILD_END - BUILD_START))\n\
      \necho \"BUILD_START=$BUILD_START\" >> \"$GITHUB_ENV\"\necho \"BUILD_END=$BUILD_END\" >> \"$GITHUB_ENV\"\necho \"BUILD_TIME=$BUILD_TIME\" >> \"$GITHUB_ENV\"\n\nIMG=\"$OUT/arch/arm64/boot/Image\"\nif [ ! -f \"$IMG\" ]; then\n  echo \"::error::Kernel Image missing\"\n  echo \"::group::Last 100 lines of build log\"\n  tail -n 100 build.log || echo \"Build log not available\"\n  echo \"::endgroup::\"\n  exit 1\nfi\n\nIMG_SIZE=$(stat -c%s \"$IMG\")\n\necho \"============================================\"\necho \"\u2705 Build Completed Successfully\"\necho \"============================================\"\necho \"Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s\"\necho \"Image: $(numfmt --to=iec-i --suffix=B \"$IMG_SIZE\")\"\n\necho \"\"\necho \"\U0001F4CA ccache Post-Build Statistics\"\necho \"============================================\"\nccache -s\necho \"============================================\"\necho \"::endgroup::\"\n"
  - name: "\U0001F4CA ccache Post-Build Statistics"
    id: ccache_stats
    if: ${{ success() && (inputs.clean == false || inputs.clean == 'false') }}
    shell: bash
    run: "set -euo pipefail\necho \"::group::ccache final statistics\"\n\nexport CCACHE_DIR=\"${{ env.CCACHE_DIR }}\"\n\necho \"Clear Temporary cache files...\"\nccache -c\n\necho \"Perform ccache eviction!\"\n# 3h = 10800s using seconds to support older ccache\nccache --evict-older-than 10800s\n\necho \"Perform LTO cache eviction!\"\nif [ -d \"$LDCACHE_DIR\" ]; then\n  # Delete LTO cache files modified more than 180 minutes (3 hours) ago\n  find \"$LDCACHE_DIR\" -type f -amin +180 -delete\n  find \"$LDCACHE_DIR\" -type d -empty -delete\nfi\n\nif [ \"${{ inputs.debug }}\" == \"true\" ]; then\n  if [ -f \"${{ env.CCACHE_LOGFILE }}\" ]; then\n    echo \"Rename ccache log\"\n    LOG_DIR=$(dirname \"${{ env.CCACHE_LOGFILE }}\")\n    NEW_LOG_NAME=\"${{ env.OP_MODEL }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log\"\n    mv \"${{ env.CCACHE_LOGFILE }}\" \"$LOG_DIR/$NEW_LOG_NAME\"\n    echo \"CCACHE_LOGFILE=$LOG_DIR/$NEW_LOG_NAME\" >> $GITHUB_ENV\n  else\n    echo \"\u26A0 ccache\
      \ log not found, skipping rename.\"\n  fi\nfi\n\nSTATS=\"$(ccache -s)\"\n\nCACHEABLE=$(echo \"$STATS\" | awk '/Cacheable calls:/ {\n  match($0, /[0-9]+/); \n  print substr($0, RSTART, RLENGTH)\n}' | head -n1)\n\nHITS=$(echo \"$STATS\" | awk '/^[[:space:]]*Hits:/ {\n  match($0, /[0-9]+/); \n  print substr($0, RSTART, RLENGTH)\n}' | head -n1)\n\nDIRECT=$(echo \"$STATS\" | awk '/Direct:/ {\n  match($0, /[0-9]+/); \n  print substr($0, RSTART, RLENGTH)\n}' | head -n1)\n\nif [ \"${CACHEABLE:-0}\" -gt 0 ]; then\n  HIT_RATE=$(awk -v h=\"${HITS:-0}\" -v c=\"$CACHEABLE\" 'BEGIN{printf \"%.1f\", (h/c)*100}')\n  DIRECT_RATE=$(awk -v d=\"${DIRECT:-0}\" -v c=\"$CACHEABLE\" 'BEGIN{printf \"%.1f\", (d/c)*100}')\nelse\n  HIT_RATE=\"0.0\"\n  DIRECT_RATE=\"0.0\"\nfi\n\necho \"hit_rate=${HIT_RATE}%\" >> \"$GITHUB_OUTPUT\"\necho \"direct_rate=${DIRECT_RATE}%\" >> \"$GITHUB_OUTPUT\"\n\necho \"::endgroup::\"\n\necho \"## \U0001F4CA ccache Statistics\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
      echo '```' >> $GITHUB_STEP_SUMMARY\nccache -s >> $GITHUB_STEP_SUMMARY\necho '```' >> $GITHUB_STEP_SUMMARY\n"
  - name: Collect Build Stats / Validate Image
    id: collect_stats
    shell: bash
    run: "set -euo pipefail\necho \"::group::Collect Build stats\"\nIMG=\"$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image\"\n\nif [ -f \"$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image\" ]; then\n  IMG=\"$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image\"\nelif [ -f \"$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image\" ]; then\n  IMG=\"$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image\"\nfi\n\nif [ -f \"$COMMON_KERNEL_FOLDER/build.log\" ]; then\n  # Count only real (compiler) warnings. Exclude harmless config-processing noise:\n  #  - vendor Kconfig quirks (e.g. drivers/misc/mediatek/**/Kconfig: \"ignoring\n  #    unsupported character\", \"no new line at end of file\", type redefinitions)\n  #  - defconfig \"override: reassigning to symbol X\" (feature steps re-set an\n  #    existing symbol; the last value wins, nothing is broken).\n  # Both are emitted from *:Kconfig / *:defconfig, never from a real .c/.h\
      \ compile.\n  WARNINGS_COUNT=\"$(grep -iE '\\bwarning:' \"$COMMON_KERNEL_FOLDER/build.log\" 2>/dev/null \\\n    | grep -cvE '(Kconfig|defconfig):[0-9]+:warning:' || true)\"\n  [ -n \"$WARNINGS_COUNT\" ] || WARNINGS_COUNT=\"0\"\nelse\n  WARNINGS_COUNT=\"0\"\nfi\n\nif [ ! -f \"$IMG\" ]; then\n  echo \"::error::Kernel Image not found at: $IMG\"\n  exit 1\nfi\n\nif ! file \"$IMG\" | grep -qi 'ARM64'; then\n  echo \"::error::Image is not ARM64 format\"\n  file \"$IMG\"\n  exit 1\nfi\n\nIMG_SIZE=$(stat -c %s \"$IMG\")\nMIN_SIZE=6102400\nif [ \"$IMG_SIZE\" -lt \"$MIN_SIZE\" ]; then\n  echo \"::error::Image size too small: $(numfmt --to=iec-i --suffix=B \"$IMG_SIZE\")\"\n  exit 1\nfi\n\nIMG_SHA256=$(sha256sum \"$IMG\" | awk '{print $1}')\nBUILD_TIME=\"${BUILD_TIME:-0}\"\n\nKERNEL_UNAME=$(strings \"$IMG\" | grep -E 'Linux version.*#' | tail -n1)\necho \"Kernel Uname: $KERNEL_UNAME\"\necho \"KERNEL_UNAME=$KERNEL_UNAME\" >> \"$GITHUB_ENV\"\n\nprintf 'warnings_count=%s\\n' \"$WARNINGS_COUNT\"\
      \ >> \"$GITHUB_OUTPUT\"\nprintf 'image_sha256=%s\\n' \"$IMG_SHA256\" >> \"$GITHUB_OUTPUT\"\nprintf 'build_time=%s\\n' \"$BUILD_TIME\" >> \"$GITHUB_OUTPUT\"\n\necho \"\u2705 Validation passed:\"\necho \"   - Warnings: $WARNINGS_COUNT\"\necho \"   - Image size: $(numfmt --to=iec-i --suffix=B \"$IMG_SIZE\")\"\necho \"   - SHA256: $IMG_SHA256\"\necho \"   - Build time: ${BUILD_TIME}s\"\necho \"::endgroup::\"\n"
  - name: Download Latest SUSFS Module from CI
    if: ${{ env.OP_SUSFS == 'true' }}
    continue-on-error: true
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
    run: "set -euo pipefail\necho \"::group::Download Latest SUSFS Module from CI\"\n\nREPO=\"sidex15/susfs4ksu-module\"\nBRANCH=\"v1.5.2+\"\nMODULE_NAME=\"ksu_module_susfs_1.5.2+_CI.zip\"\n\nmkdir -p \"$AK3_FOLDER\"\nMODULE_PATH=\"$AK3_FOLDER/$MODULE_NAME\"\n\n# `|| true` keeps a transient API failure (e.g. 503) on the warning\n# path below instead of killing the step under set -e\nLATEST_RUN_ID=\"$(\n  curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \\\n    -H \"Authorization: Bearer ${GH_TOKEN}\" \\\n    -H \"Accept: application/vnd.github+json\" \\\n    \"https://api.github.com/repos/${REPO}/actions/runs?status=success&per_page=50\" |\n  jq -r --arg branch \"$BRANCH\" '\n    .workflow_runs[] | select(.head_branch == $branch) | .id\n  ' | head -n 1 || true\n)\"\n\nif [ -z \"$LATEST_RUN_ID\" ] || [ \"$LATEST_RUN_ID\" = \"null\" ]; then\n  echo \"::warning::No successful run found for branch $BRANCH\"\n  echo \"::endgroup::\"\n  exit 0\nfi\n\nARTIFACT_URL=\"$(\n  curl -fsSL --retry\
      \ 5 --retry-delay 5 --retry-all-errors \\\n    -H \"Authorization: Bearer ${GH_TOKEN}\" \\\n    -H \"Accept: application/vnd.github+json\" \\\n    \"https://api.github.com/repos/${REPO}/actions/runs/${LATEST_RUN_ID}/artifacts\" |\n  jq -r '.artifacts[] | select(.expired == false) | .archive_download_url' |\n  head -n 1 || true\n)\"\n\nif [ -z \"$ARTIFACT_URL\" ] || [ \"$ARTIFACT_URL\" = \"null\" ]; then\n  echo \"::warning::Failed to fetch artifact URL\"\n  echo \"::endgroup::\"\n  exit 0\nfi\n\nif curl -fL --retry 5 --retry-delay 5 --retry-all-errors \\\n  -H \"Authorization: Bearer ${GH_TOKEN}\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  -o \"$MODULE_PATH\" \\\n  \"$ARTIFACT_URL\"; then\n\n  FILE_SIZE=\"$(stat -c%s \"$MODULE_PATH\" 2>/dev/null || echo 0)\"\n\n  if [ \"$FILE_SIZE\" -lt 1000 ]; then\n    echo \"::warning::Downloaded module ZIP too small: ${FILE_SIZE} bytes\"\n    rm -f \"$MODULE_PATH\"\n    echo \"::endgroup::\"\n    exit 0\n  fi\n\n  if unzip -l \"$MODULE_PATH\"\
      \ | grep -q 'module.prop'; then\n    echo \"MODULE_DOWNLOADED=true\" >> \"$GITHUB_ENV\"\n    echo \"MODULE_SOURCE=CI\"       >> \"$GITHUB_ENV\"\n    echo \"\u2705 Valid SUSFS module ZIP downloaded\"\n  else\n    echo \"::warning::Downloaded ZIP does not contain module.prop\"\n  fi\nelse\n  echo \"::warning::Failed to download artifact\"\nfi\n\necho \"::endgroup::\"\n"
  - name: Create Kernel ZIP
    id: create_zip
    shell: bash
    run: "set -euo pipefail\necho \"::group::Create kernel ZIP package\"\n\nIMAGE_PATH=\"$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image\"\n\nif [ -f \"$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image\" ]; then\n  IMAGE_PATH=\"$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image\"\nelif [ -f \"$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image\" ]; then\n  IMAGE_PATH=\"$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image\"\nfi\n\nif [ ! -f \"$IMAGE_PATH\" ]; then\n  echo \"::error::Built Image not found at: $IMAGE_PATH\"\n  exit 1\nfi\n\nif [ ! -d \"$AK3_FOLDER\" ] || [ ! -f \"$AK3_FOLDER/anykernel.sh\" ]; then\n  echo \"::error::AnyKernel3 was not synced. Expected: $AK3_FOLDER/anykernel.sh\"\n  echo \"::error::Check the device manifest for the AnyKernel3 project (Bouteillepleine/gki-2.0).\"\n  exit 1\nfi\n\ncp \"$IMAGE_PATH\" \"$AK3_FOLDER/Image\"\n\nmv \"${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt\" \"$AK3_FOLDER/\"\
      \ncd \"$AK3_FOLDER\"\n\nsed -i 's/do.check_boot_version=.*/do.check_boot_version=1/' anykernel.sh\n\n# BBG efisp/abl whitelist flash control is baked into the AnyKernel3\n# (Bouteillepleine/AnyKernel3 gki-2.0) \u2014 no build-time anykernel.sh patch needed.\n\nZIP_MODEL=$(echo \"$OP_MODEL\" | sed 's/-[0-9]\\+\\.[0-9]\\+\\.[0-9]\\+$//')\nif [ \"${{ env.OP_SUSFS }}\" = true ]; then\n  ZIP_NAME=\"AK3_${ZIP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_${{ inputs.ksu_type }}_${KSUVER:-unknown}_SuSFS_${SUSVER:-unknown}.zip\"\nelse\n  ZIP_NAME=\"AK3_${ZIP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_${{ inputs.ksu_type }}_${KSUVER:-unknown}.zip\"\nfi\nmkdir -p \"$ARTIFACTS_FOLDER\"\n\necho \"Creating flashable ZIP: $ZIP_NAME\"\n\nif ! zip -r9 \"$ZIP_NAME\" ./* \\\n     -x \"*.git*\" \\\n     -x \"$ZIP_NAME\" \\\n     -x \"README.md\" 2>&1 | tee /tmp/zip.log; then\n  echo \"::error::Failed to create ZIP package\"\n  exit 1\nfi\n\nmv \"$ZIP_NAME\" \"$ARTIFACTS_FOLDER/\"\n\nfind \"$ARTIFACTS_FOLDER\"\
      \ -maxdepth 1 -type f ! -name \"$ZIP_NAME\" -delete\n\nZIP_SIZE=$(stat -c%s \"$ARTIFACTS_FOLDER/$ZIP_NAME\")\nZIP_SHA256=$(sha256sum \"$ARTIFACTS_FOLDER/$ZIP_NAME\" | awk '{print $1}')\nprintf 'zip_sha256=%s\\n' \"$ZIP_SHA256\" >> \"$GITHUB_OUTPUT\"\n\necho \"zip_name=$ZIP_NAME\" >> \"$GITHUB_OUTPUT\"\necho \"ZIP_NAME=$ZIP_NAME\" >> \"$GITHUB_ENV\"\n\necho \"\"\necho \"\u2705 Kernel ZIP created successfully\"\necho \"   Name: $ZIP_NAME\"\necho \"   Size: $(numfmt --to=iec-i --suffix=B \"$ZIP_SIZE\")\"\necho \"   SHA256: $ZIP_SHA256\"\necho \"::endgroup::\"\n"
  - name: Final Build Summary
    shell: bash
    run: "set -euo pipefail\n\n# Get commit SHAs with fallback\nKSU_SHA=\"${KSU_COMMIT_SHA:-unknown}\"\nSUSFS_SHA=\"${SUSFS_COMMIT_SHA:-unknown}\"\n\n{\n  echo \"Model: ${{ env.OP_MODEL }}\"\n  echo \"OS Version: ${{ env.OP_OS_VERSION }}\"\n  echo \"Android: ${{ env.ANDROID_VER }}\"\n  echo \"Kernel base: ${{ env.KERNEL_VER }}\"\n  echo \"Kernel full: ${{ env.KERNEL_FULL_VER }}\"\n  echo \"Kernel Uname: ${{ env.KERNEL_UNAME }}\"\n  echo \"Build User: ${{ env.BUILD_USER }}\"\n  echo \"Build Host: ${{ env.BUILD_HOST }}\"\n  echo \"SukiSU Version: ${KSUVER:-unknown}\"\n  echo \"SukiSU commit SHA: ${KSU_SHA:-unknown}\"\n  if [ \"${{ env.OP_SUSFS }}\" = true ]; then\n    echo \"SUSFS Version: ${SUSVER:-unknown}\"\n    echo \"SUSFS commit SHA: $SUSFS_SHA\"\n  fi\n  echo \"Optimization: ${{ inputs.optimize_level }}\"\n  echo \"Clean Build: ${{ inputs.clean }}\"\n  echo \"\"\n  echo \"=== OnePlus Features ===\"\n  echo \"Kernel Optimisations: ${{ env.OP_OPT }}\"\n  echo \"BBR: ${{ env.OP_BBR }}\"\
      \n  echo \"BBRv3: ${{ env.OP_BBR3 }}\"\n  echo \"BBG: ${{ env.OP_BBG }}\"\n  echo \"HMBIRD SCX: ${{ env.OP_HMBIRD }}\"\n  echo \"TTL: ${{ env.OP_TTL }}\"\n  echo \"IP_SET & IPv6 NAT: ${{ env.OP_IP_SET }}\"\n  echo \"Unicode Fix: ${{ env.OP_UNICODE }}\"\n  echo \"NTSync: ${{ env.OP_NTSYNC }}\"\n  echo \"Droidspaces: ${{ env.OP_DS }}\"\n  echo \"\"\n  echo \"Image SHA256: ${{ steps.collect_stats.outputs.image_sha256 }}\"\n  echo \"AnyKernel3 ZIP SHA256: ${{ steps.create_zip.outputs.zip_sha256 }}\"\n  echo \"Compiler: ${CLANG_VERSION:-unknown}\"\n  echo \"Warnings Count: ${{ steps.collect_stats.outputs.warnings_count }}\"\n  echo \"Build Time: ${{ steps.collect_stats.outputs.build_time }}s\"\n  if [ \"${{ inputs.clean }}\" == \"false\" ]; then\n    echo \"ccache Hit Rate: ${{ steps.ccache_stats.outputs.hit_rate }}\"\n    echo \"ccache Direct Rate: ${{ steps.ccache_stats.outputs.direct_rate }}\"\n  else\n    echo \"ccache: Disabled (clean build)\"\n  fi\n  echo \"Artifact Name: ${{ env.ZIP_NAME\
      \ }}\"\n} | tee summary.txt\n\n# One-line header so the collapsed block is scannable across 100+ devices\nSUM_HEAD=\"\U0001F3AF <b>${{ env.OP_MODEL }}</b> \u2014 ${{ steps.save_metadata.outputs.kernel_version }}\"\nSUM_HEAD=\"${SUM_HEAD} \xB7 \u26A1SukiSU ${KSUVER:-?}\"\nif [ \"${{ env.OP_SUSFS }}\" = true ]; then SUM_HEAD=\"${SUM_HEAD} \xB7 SUSFS ${SUSVER:-?}\"; fi\nSUM_HEAD=\"${SUM_HEAD} \xB7 \u23F1 ${{ steps.collect_stats.outputs.build_time }}s\"\nif [ \"${{ steps.collect_stats.outputs.warnings_count }}\" != \"0\" ]; then\n  SUM_HEAD=\"${SUM_HEAD} \xB7 \u26A0\uFE0F ${{ steps.collect_stats.outputs.warnings_count }}\"\nfi\n\n{\n  echo \"<details>\"\n  echo \"<summary>${SUM_HEAD}</summary>\"\n  echo \"\"\n  echo \"#### \U0001F3AF Kernel Build Summary\"\n  echo \"\"\n  echo \"| Metric | Value |\"\n  echo \"|--------|-------|\"\n  echo \"| **Model** | ${{ env.OP_MODEL }} |\"\n  echo \"| **OS Version** | ${{ env.OP_OS_VERSION }} |\"\n  echo \"| **Kernel Version** | ${{ steps.save_metadata.outputs.kernel_version\
      \ }} |\"\n  echo \"| **Kernel Uname** | \\`${{ env.KERNEL_UNAME }}\\` |\"\n  echo \"| **Build User** | ${{ env.BUILD_USER }} |\"\n  echo \"| **Build Host** | ${{ env.BUILD_HOST }} |\"\n  echo \"| **SukiSU Version** | ${KSUVER:-unknown} |\"\n  \n  if [ \"$KSU_SHA\" != \"unknown\" ]; then\n    echo \"| **SukiSU Commit** | [\\`${KSU_SHA:0:8}\\`](https://github.com/SukiSU-Ultra/SukiSU-Ultra/commit/$KSU_SHA) |\"\n  else\n    echo \"| **SukiSU Commit** | unknown |\"\n  fi\n  \n  if [ \"${{ env.OP_SUSFS }}\" = true ]; then\n    echo \"| **SUSFS Version** | ${SUSVER:-unknown} |\"\n    \n    if [ \"$SUSFS_SHA\" != \"unknown\" ]; then\n      echo \"| **SUSFS Commit** | [\\`${SUSFS_SHA:0:8}\\`](https://gitlab.com/simonpunk/susfs4ksu/-/commit/$SUSFS_SHA) |\"\n    else\n      echo \"| **SUSFS Commit** | unknown |\"\n    fi\n  fi\n  \n  echo \"\"\n  echo \"#### \U0001F527 OnePlus Features\"\n  echo \"\"\n  echo \"| Feature | Status |\"\n  echo \"|---------|--------|\"\n  echo \"| **Kernel Optimisations**\
      \ | ${{ env.OP_OPT }} |\"\n  echo \"| **BBR** | ${{ env.OP_BBR }} |\"\n  echo \"| **BBRv3** | ${{ env.OP_BBR3 }} |\"\n  echo \"| **BBG** | ${{ env.OP_BBG }} |\"\n  echo \"| **HMBIRD SCX** | ${{ env.OP_HMBIRD }} |\"\n  echo \"| **TTL** | ${{ env.OP_TTL }} |\"\n  echo \"| **IP_SET & IPv6 NAT** | ${{ env.OP_IP_SET }} |\"\n  echo \"| **Unicode Fix** | ${{ env.OP_UNICODE }} |\"\n  echo \"| **NTSync** | ${{ env.OP_NTSYNC }} |\"\n  echo \"| **Droidspaces** | ${{ env.OP_DS }} |\"\n  \n  echo \"\"\n  echo \"#### \U0001F4CA Build Metrics\"\n  echo \"\"\n  echo \"| Metric | Value |\"\n  echo \"|--------|-------|\"\n  echo \"| **Optimization** | ${{ inputs.optimize_level }} |\"\n  echo \"| **Clean Build** | ${{ inputs.clean }} |\"\n  echo \"| **Build Time** | ${{ steps.collect_stats.outputs.build_time }}s |\"\n  \n  if [ \"${{ inputs.clean }}\" == \"false\" ]; then\n    echo \"| **ccache Hit Rate** | ${{ steps.ccache_stats.outputs.hit_rate }} |\"\n    echo \"| **ccache Direct Rate** | ${{ steps.ccache_stats.outputs.direct_rate\
      \ }} |\"\n  fi\n  \n  echo \"| **Image SHA256** | \\`${{ steps.collect_stats.outputs.image_sha256 }}\\` |\"\n  echo \"| **Warnings** | ${{ steps.collect_stats.outputs.warnings_count }} |\"\n  echo \"| **Compiler** | \\`${CLANG_VERSION:-unknown}\\` |\"\n  echo \"| **Artifact Name** | \\`${{ env.ZIP_NAME }}\\` |\"\n  echo \"| **AnyKernel3 SHA256** | \\`${{ steps.create_zip.outputs.zip_sha256 }}\\` |\"\n  echo \"\"\n  echo \"</details>\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
  - name: Upload Debug Artifacts
    if: ${{ always() && !cancelled() && inputs.debug == 'true' }}
    uses: actions/upload-artifact@v7
    with:
      name: ${{ env.DEBUG_ZIP_NAME }}
      path: ${{ env.DEBUG_ARTIFACTS_FOLDER }}
      compression-level: 9
      retention-days: 90
  - name: Upload Artifacts
    if: success() && steps.create_zip.conclusion == 'success'
    uses: actions/upload-artifact@v7
    with:
      name: ${{ env.ZIP_NAME }}
      path: ${{ env.ARTIFACTS_FOLDER }}/${{ env.ZIP_NAME }}
      archive: false
      compression-level: 0
      retention-days: 90
  - name: Upload ccache log
    if: success() && inputs.debug == 'true' && steps.build_kernel_step.conclusion == 'success'
    uses: actions/upload-artifact@v7
    with:
      name: ${{ env.OP_MODEL }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log
      path: ${{ env.CCACHE_LOGFILE }}
      archive: false
      compression-level: 0
      retention-days: 90
  - name: "\U0001F4E5 Checkout Code"
    uses: actions/checkout@v6
    if: always() && steps.build_kernel_step.conclusion == 'success'
    with:
      path: main-source
      fetch-depth: 1
  - name: Normalize ccache before saving
    if: ${{ always() && steps.build_kernel_step.conclusion == 'success' }}
    shell: bash
    run: "set -euo pipefail\necho \"::group::Normalize ccache before saving\"\n\nunset CCACHE_DEPEND              || true\nunset CCACHE_READONLY_DIRECT     || true\nunset CCACHE_COMPRESSION         || true\nunset CCACHE_COMPRESSION_LEVEL   || true\nunset CCACHE_FILE_CLONE          || true\nunset CCACHE_INODE_CACHE         || true\n\n{\n  echo \"CCACHE_COMPILERCHECK=content\"\n  echo \"CCACHE_COMPRESS=true\"\n  echo \"CCACHE_COMPRESSLEVEL=3\"\n  echo \"CCACHE_DIRECT=true\"\n  echo \"CCACHE_FILECLONE=true\"\n  echo \"CCACHE_INODECACHE=true\"\n  echo \"CCACHE_NOREADONLY_DIRECT=true\"\n  echo \"CCACHE_NOHASHDIR=true\"\n  echo \"CCACHE_IGNOREOPTIONS=--sysroot*\"\n} >> \"$GITHUB_ENV\"\n\nif [ -d \"${CCACHE_DIR:-}\" ]; then\n  echo \"ccache directory: $CCACHE_DIR\"\n  echo \"Size before cleanup:\"\n  du -sh \"$CCACHE_DIR\" || true\n\n  ccache -c || true\n  ccache --evict-older-than 10800s || true\n\n  echo \"Size after cleanup:\"\n  du -sh \"$CCACHE_DIR\" || true\nelse\n  echo \"No ccache directory\
      \ found.\"\nfi\n\necho \"::endgroup::\"\n"
  - name: Save ccache cache
    if: always() && steps.build_kernel_step.conclusion == 'success'
    uses: ./action-source/.github/actions/cache/save
    with:
      cache_path: ${{ env.CCACHE_DIR }}
      cache_key: ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
      cache_bucket: ccache-cache
      debug: ${{ inputs.debug }}
      github_token: ${{ inputs.github_token }}
      working_dir: ./main-source
      compression_level: 6
  - name: Trim LTO LD cache before saving
    if: ${{ always() && env.OP_LTO != 'none' && steps.build_kernel_step.conclusion == 'success' }}
    continue-on-error: true
    shell: bash
    run: "set -euo pipefail\necho \"::group::Trim LTO LD cache before saving\"\n\nif [ -d \"${LDCACHE_DIR:-}\" ]; then\n  echo \"LTO cache directory: $LDCACHE_DIR\"\n  echo \"Size before trim:\"\n  du -sh \"$LDCACHE_DIR\" || true\n\n  # Evict by access time, not mtime: ld.lld never updates a cache\n  # entry's mtime when it reuses it, so an mtime-based trim deletes the\n  # entire restored/reused cache on cache-hit builds \u2014 collapsing the\n  # saved archive to a few hundred bytes. atime tracks reuse and keeps\n  # the live working set.\n  find \"$LDCACHE_DIR\" -type f -amin +360 -delete || true\n  find \"$LDCACHE_DIR\" -type d -empty -delete     || true\n\n  echo \"Size after trim:\"\n  du -sh \"$LDCACHE_DIR\" || true\nelse\n  echo \"No LTO cache directory found.\"\nfi\n\necho \"::endgroup::\"\n"
  - name: Save LTO LD cache
    if: ${{ always() && env.OP_LTO != 'none' && steps.build_kernel_step.conclusion == 'success' }}
    uses: ./action-source/.github/actions/cache/save
    with:
      cache_path: ${{ env.LDCACHE_DIR }}
      cache_key: ${{ inputs.ksu_type }}-v3-LTO-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
      cache_bucket: lto-cache
      debug: ${{ inputs.debug }}
      github_token: ${{ inputs.github_token }}
      working_dir: ./main-source
      compression_level: 6
  - name: "\U0001F9F9 Cleanup on failure"
    if: ${{ failure() }}
    shell: bash
    run: "set -euo pipefail\necho \"::group::Cleanup on failure\"\n\necho \"Build failed \u2014 cleaning up large temporary artifacts to free runner disk space\"\n\nif [ -d \"${COMMON_KERNEL_FOLDER:-}/out\" ]; then\n  echo \"Removing build output: $COMMON_KERNEL_FOLDER/out\"\n  rm -rf \"$COMMON_KERNEL_FOLDER/out\" || true\nfi\n\nif [ -d \"${SUSFS_FOLDER:-}\" ]; then\n  echo \"Removing SUSFS sources: $SUSFS_FOLDER\"\n  rm -rf \"$SUSFS_FOLDER\" || true\nfi\n\nif [ -d \"${KERNEL_PATCHES_FOLDER:-}\" ]; then\n  echo \"Removing kernel patches: $KERNEL_PATCHES_FOLDER\"\n  rm -rf \"$KERNEL_PATCHES_FOLDER\" || true\nfi\n\nrm -f /tmp/sukisu_setup_*.sh /tmp/bbg_setup_*.sh /tmp/clone_log_* || true\n\necho \"\"\necho \"Disk usage after cleanup:\"\ndf -h \"$GITHUB_WORKSPACE\" || true\n\necho \"::endgroup::\"\n"
