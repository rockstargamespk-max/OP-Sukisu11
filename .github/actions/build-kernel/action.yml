      '
  - name: Sanitize SukiSU v2.3.0 compatibility files
    shell: bash
    if: ${{ env.OP_SUSFS == 'true' && env.SUSVER == 'v2.3.0' }}
    run: "set -euo pipefail\necho \"::group::Sanitize SukiSU v2.3.0 compatibility files\"\n\n# The OP13R stat prototype must stay inside the sucompat.h guard.\n# The previous helper appended it after #endif, producing #endifint.\npython3 - <<'PY2'\nfrom pathlib import Path\nimport os\n\nproto = 'int ksu_handle_stat_user(int *dfd, const char __user **filename_user, int *flags);'\nheaders = [\n    Path(os.environ['KERNEL_PLATFORM_FOLDER']) / 'KernelSU/kernel/feature/sucompat.h',\n    Path(os.environ['COMMON_KERNEL_FOLDER']) / 'drivers/kernelsu/feature/sucompat.h',\n]\nfor h in headers:\n    if not h.is_file():\n        continue\n    lines = h.read_text().splitlines()\n    cleaned = []\n    for line in lines:\n        if line.strip() == proto:\n            continue\n        if '#endifint ksu_handle_stat_user' in line:\n            line = '#endif'\n        cleaned.append(line)\n    idx = next((i for i in range(len(cleaned) - 1, -1, -1)\n                if cleaned[i].strip().startswith('#endif')),\
      \ None)\n    if idx is None:\n        cleaned.append(proto)\n    else:\n        cleaned.insert(idx, proto)\n    h.write_text('\\n'.join(cleaned).rstrip() + '\\n')\n    print(f'Normalized {h}')\nPY2\n\n# SUSFS v2.3.0 removes the legacy app-profile init path. Some SukiSU\n# revisions leave the old call in core/init.c, causing an implicit\n# declaration error. Remove only that obsolete call.\nfor f in \\\n  \"$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/core/init.c\" \\\n  \"$COMMON_KERNEL_FOLDER/drivers/kernelsu/core/init.c\"; do\n  if [ -f \"$f\" ]; then\n    sed -i '/^[[:space:]]*ksu_app_profile_init[[:space:]]*();[[:space:]]*$/d' \"$f\"\n  fi\ndone\n\nfor h in \\\n  \"$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/feature/sucompat.h\" \\\n  \"$COMMON_KERNEL_FOLDER/drivers/kernelsu/feature/sucompat.h\"; do\n  if [ -f \"$h\" ]; then\n    if grep -qE '#endif[[:space:]]*int[[:space:]]+ksu_handle_stat_user' \"$h\"; then\n      echo \"::error::Malformed sucompat.h remains: $h\"\n      exit 1\n    fi\n\
      \    if ! tail -n 20 \"$h\" | grep -q '^#endif[[:space:]]*$'; then\n      echo \"::error::sucompat.h guard is not terminated cleanly: $h\"\n      exit 1\n    fi\n  fi\ndone\n\nfor f in \\\n  \"$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/core/init.c\" \\\n  \"$COMMON_KERNEL_FOLDER/drivers/kernelsu/core/init.c\"; do\n  if [ -f \"$f\" ] && grep -qE '^[[:space:]]*ksu_app_profile_init[[:space:]]*\\(\\);' \"$f\"; then\n    echo \"::error::Obsolete ksu_app_profile_init() call remains: $f\"\n    exit 1\n  fi\ndone\n\necho \"Compatibility files sanitized successfully\"\necho \"::endgroup::\"\n"
  - name: Add BBG
    if: ${{ env.OP_BBG == 'true' }}
    shell: bash
    run: "set -euo pipefail\necho \"::group::Add BBG LSM\"\ncd \"$KERNEL_PLATFORM_FOLDER\"\necho \"Adding BBG...\"\nif ! wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then\n  echo \"::warning::BBG setup script failed, continuing anyway\"\nfi\necho \"CONFIG_BBG=y\" >> common/arch/arm64/configs/gki_defconfig\nsed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig\n\ncase \"$OP_BRANCH\" in\n  wild/sm8850|wild/sm8845)\n    echo \"Applying BBG efisp abl whitelist patch\"\n    patch -p1 < \"$KERNEL_PATCHES_FOLDER/common/bbg/0001-Enable-abl-and-efisp-flashing-for-efisp-exploit-devices.patch\"\n  ;;\nesac\n\necho \"\u2705 BBG LSM added\"\necho \"::endgroup::\"\n"
  - name: Apply KSU Hooks
    shell: bash
    if: ${{ env.NEED_HOOKS == 'true' }}
    run: "set -euo pipefail\necho \"::group::Apply KSU hooks\"\ncd \"$COMMON_KERNEL_FOLDER\"\npatch -p1 < \"$KERNEL_PATCHES_FOLDER/next/scope_min_manual_hooks_v1.4.patch\"\necho \"\u2705 KSU hooks applied\"\necho \"::endgroup::\"\n"
  - name: Apply Other Patches
    shell: bash
    run: "set -euo pipefail\necho \"::group::Apply Other patches\"\ncd \"$COMMON_KERNEL_FOLDER\"\nKERNEL_VERSION=\"${{ env.KERNEL_VER }}\"\nMIN_VERSION=\"5.16\"\nif [ \"$(printf '%s\\n' \"$KERNEL_VERSION\" \"$MIN_VERSION\" | sort -V | head -n1)\" = \"$KERNEL_VERSION\" ]; then\n  echo \"Patching ptrace!\"\n  patch -p1 -F 3 < \"$KERNEL_PATCHES_FOLDER/gki_ptrace.patch\"\nelse\n  echo \"Kernel >= $MIN_VERSION, skipping ptrace patch\"\nfi\n\nif [ \"$OP_HMBIRD\" = true ]; then\n  echo \"Patching hmbird!\"\n  HMBIRD_MODEL=$(echo \"$OP_MODEL\" | sed 's/-[0-9]\\+\\.[0-9]\\+\\.[0-9]\\+$//')\n  case \"$OP_MODEL\" in\n    OP-ACE-5-ULTRA-6.6.50|OP-ACE-5-PRO-6.6.30|OP13-6.6.30|OP13-CPH-6.6.56|OP13T-6.6.89|OP13-6.6.89|OP-ACE-5-PRO-6.6.89)\n      FENGCHI_DIR=\"$KERNEL_PATCHES_FOLDER/oneplus/hmbird/deprecated\" ;;\n    *)\n      FENGCHI_DIR=\"$KERNEL_PATCHES_FOLDER/oneplus/hmbird\" ;;\n  esac\n  FENGCHI_PATCH=\"$FENGCHI_DIR/fengchi_${HMBIRD_MODEL}_${OP_OS_VERSION}.patch\"\n  dos2unix \"$FENGCHI_PATCH\"\n\
      \  # The fengchi hunk that deletes OnePlus's CONFIG_SLIM_SCHED KABI block from task_struct\n  # (sched.h hunk #3) rejects on many trees \u2014 the block is absent, or present with divergent\n  # context (OP13/OP13T, 6.6.30, N30-SE). It is pure cleanup: HMBIRD (hunk #4) uses\n  # android_oem_data1 not KABI slots 1/2, and no fengchi hunk *adds* to slots 1/2 \u2014 so always\n  # drop that one hunk and leave SLIM_SCHED (stock) in place. Ref: Numbersf/SCHED_PATCH ca7c5c0.\n  FENGCHI_PATCH_FIXED=\"$(mktemp)\"\n  awk '\n    function flush(){ if (buf != \"\" && buf !~ /ANDROID_KABI_USE\\(1, unsigned long sched_prop\\)/) printf \"%s\", buf; buf=\"\" }\n    /^@@ /{ flush(); buf=$0 ORS; next }\n    /^diff --git/{ flush(); print; next }\n    { if (buf==\"\") print; else buf=buf $0 ORS }\n    END{ flush() }\n  ' \"$FENGCHI_PATCH\" > \"$FENGCHI_PATCH_FIXED\"\n  FENGCHI_PATCH=\"$FENGCHI_PATCH_FIXED\"\n  patch -p1 -F 3 < \"$FENGCHI_PATCH\"\n  dos2unix \"$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch\"\
      \n  patch -p1 -F 3 < \"$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch\"\n  chmod +x ./drivers/of/overwriter/overwrite_configs/convert_configs.sh\n  dos2unix \"$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch\"\n  patch -p1 -F 3 < \"$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch\"\nelse\n  echo \"Hmbird not enabled, skipping fengchi patch\"\nfi\n\necho \"\u2705 Other patches applied\"\necho \"::endgroup::\"\n"
  - name: Apply Optimisation Patches
    if: ${{ env.OP_OPT == 'true' }}
    shell: bash
    run: "set -euo pipefail\necho \"::group::Apply Optimisation patches\"\ncd \"$COMMON_KERNEL_FOLDER\"\nKERNEL_VERSION=\"${{ env.KERNEL_VER }}\"\nMIN_VERSION=\"5.16\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/optimized_mem_operations.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/file_struct_8bytes_align.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/reduce_cache_pressure.patch\"\n\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/mem_opt_prefetch.patch\"\n\nif [ \"$(printf '%s\\n' \"$KERNEL_VERSION\" \"$MIN_VERSION\" | sort -V | tail -n1)\" = \"$KERNEL_VERSION\" ]; then\n  patch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch\"\nelif [ \"$(printf '%s\\n' \"$KERNEL_VERSION\" \"5.11\" | sort -V | tail -n1)\" = \"$KERNEL_VERSION\" ]; then\n  sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/'\
      \ \"$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch\" | patch -p1 --forward\nelse\n  echo \"Optimised memcmp patch not found!\"\nfi\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/minimise_wakeup_time.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/int_sqrt.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/force_tcp_nodelay.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/reduce_gc_thread_sleep_time.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/add_timeout_wakelocks_globally.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/f2fs_reduce_congestion.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/reduce_freeze_timeout.patch\"\n\nif [ \"$(printf '%s\\n' \"$KERNEL_VERSION\" \"$MIN_VERSION\" | sort -V | head -n1)\" = \"$KERNEL_VERSION\" ]; then\n  patch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch\"\nelse\n  cat \"$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch\"\
      \ | sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' | patch -p1 -F3 --forward\nfi\n\necho \"Patching add_limitation_scaling_min_freq.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/add_limitation_scaling_min_freq.patch\"\necho \"Patching re_write_limitation_scaling_min_freq.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/re_write_limitation_scaling_min_freq.patch\"\necho \"Patching adjust_cpu_scan_order.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/adjust_cpu_scan_order.patch\"\necho \"Patching avoid_extra_s2idle_wake_attempts.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/avoid_extra_s2idle_wake_attempts.patch\"\necho \"Patching disable_cache_hot_buddy.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/disable_cache_hot_buddy.patch\"\necho \"Patching f2fs_enlarge_min_fsync_blocks.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/f2fs_enlarge_min_fsync_blocks.patch\"\
      \necho \"Patching increase_ext4_default_commit_age.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/increase_ext4_default_commit_age.patch\"\necho \"Patching increase_sk_mem_packets.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/increase_sk_mem_packets.patch\"\necho \"Patching reduce_pci_pme_wakeups.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/reduce_pci_pme_wakeups.patch\"\necho \"Patching silence_irq_cpu_logspam.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/silence_irq_cpu_logspam.patch\"\necho \"Patching silence_system_logspam.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/silence_system_logspam.patch\"\necho \"Patching use_unlikely_wrap_cpufreq.patch\"\npatch -p1 --forward < \"$KERNEL_PATCHES_FOLDER/common/use_unlikely_wrap_cpufreq.patch\"\n\necho \"\u2705 Optimisation Patches applied\"\necho \"::endgroup::\"\n"
  - name: Apply NTSync Patch
    shell: bash
    if: ${{ env.OP_NTSYNC == 'true' }}
    run: "set -euo pipefail\necho \"::group::Apply NTSync patch\"\ncd \"$COMMON_KERNEL_FOLDER\"\nNTSYNC_FOLDER=\"$KERNEL_PATCHES_FOLDER/common/ntsync\"\nGKI_KEY=\"${ANDROID_VER}-${KERNEL_VER}\"\nBRANCH_SUFFIX=$(basename \"$OP_BRANCH\")\n\nNTSYNC_PATCH=\"\"\nif [ -n \"$NTSYNC_PATCH\" ]; then\n  if [ ! -f \"$NTSYNC_PATCH\" ]; then\n    echo \"::error::NTSync compat patch not found for ${OP_MODEL}: $(basename $NTSYNC_PATCH)\"\n    exit 1\n  fi\nelif [ -f \"$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OP_OS_VERSION}.patch\" ]; then\n  NTSYNC_PATCH=\"$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OP_OS_VERSION}.patch\"\nelif [ -f \"$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch\" ]; then\n  NTSYNC_PATCH=\"$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch\"\nelse\n  echo \"::error::NTSync patch not found for ${GKI_KEY} (Model: ${OP_MODEL}, Android Version: ${OP_OS_VERSION})\"\n  exit 1\nfi\n\necho \"Using patch: $(basename $NTSYNC_PATCH)\"\nif [ \"$ANDROID_VER\" = \"android16\" ] && [ \"$KERNEL_VER\" = \"\
      6.12\" ]; then\n  echo \"Removing pre-existing ntsync files for android16-6.12\"\n  rm -f include/uapi/linux/ntsync.h\n  rm -f drivers/misc/ntsync.c\nfi\n\necho \"Patching $(basename $NTSYNC_PATCH)!\"\npatch -p1 --forward < \"$NTSYNC_PATCH\"\necho \"Patching ntsync_base!\"\npatch -p1 --forward < \"$NTSYNC_FOLDER/ntsync_base.patch\"\ncat >> \"$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig\" <<EOF\nCONFIG_NTSYNC=y\nEOF\necho \"\u2705 NTSync patch applied\"\necho \"::endgroup::\"\n"
  - name: Apply Unicode Fix Patch
