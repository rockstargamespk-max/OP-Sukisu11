      chmod +x "$SCRIPT"


      # The helper natively supports SUSFS v2.1.0/v2.2.0/v2.3.0.

      # OP13R/Linux 6.1 stat-hook compatibility is handled inside the helper,

      # so the workflow no longer rewrites the helper at runtime.

      bash "$SCRIPT"


      echo "SUSFS_PATCH_APPLIED=true" >> "$GITHUB_ENV"

      echo "::endgroup::"

      '
  - name: Apply SukiSU SELinux Hide Implementation (OP13R)
